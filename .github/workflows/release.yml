name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.tar.gz'

  publish-npm:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Sync npm version with git tag
        working-directory: npm
        run: |
          VER="${GITHUB_REF_NAME#v}"
          npm version "$VER" --no-git-tag-version
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Smoke test packed package
        working-directory: npm
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Install the locally packed wrapper rather than pulling the just-
          # published version from the npm registry. Newly published scoped
          # versions can take several minutes to become resolvable (ETARGET),
          # which would falsely fail an otherwise-successful release. The packed
          # tarball exercises the same path — postinstall downloads the binary
          # from the already-published GitHub release (this job needs:
          # goreleaser) and verifies its checksum — with no dependency on npm
          # registry propagation.
          TGZ="$(npm pack | tail -1)"
          mkdir /tmp/slk-smoke && cd /tmp/slk-smoke
          npm init -y >/dev/null
          npm install --no-save "$GITHUB_WORKSPACE/npm/$TGZ"
          ./node_modules/.bin/slk --version | grep -F "slk ${VER}"
