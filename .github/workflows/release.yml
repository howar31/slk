name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*.tar.gz'

  publish-npm:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Sync npm version with git tag
        working-directory: npm
        run: |
          VER="${GITHUB_REF_NAME#v}"
          npm version "$VER" --no-git-tag-version
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Smoke test installed package
        run: |
          mkdir /tmp/slk-smoke && cd /tmp/slk-smoke
          npm init -y >/dev/null
          # Newly published scoped packages can take a minute to propagate
          # across the npm registry; retry install until it resolves.
          for i in $(seq 1 10); do
            if npm install --no-save "@howar31/slk@${GITHUB_REF_NAME#v}"; then
              break
            fi
            echo "npm registry not ready (attempt $i/10); waiting 30s..."
            sleep 30
          done
          ./node_modules/.bin/slk --version
